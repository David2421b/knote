services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-knoteadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-KnoteDevSecret123!}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"

  knote:
    build: .
    depends_on:
      - mongo
      - minio
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/dev
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: image-storage
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-knoteadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-KnoteDevSecret123!}
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  minio-data:
